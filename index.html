<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tina He</title>
<meta name="description" content="Projects, art, microscopy, and writing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafafa;
  --grid:rgba(0,0,0,.05);
  --ink:#0a0a0a;
  --muted:#5b5b5b;
  --paper:#fff;
  --paper-ink:#0a0a0a;
  --slate:#0a0a0a;
  --slate-ink:#f7f7f5;
  --edge:#0a0a0a;
  --smudge:rgba(0,0,0,.07);
  --card-bg:#fff;
  --card-ink:#0a0a0a;
  --shot-shadow:rgba(0,0,0,.26);
  --marker:"Permanent Marker","Segoe Script",cursive;
  --mono:"Space Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101011; --grid:rgba(255,255,255,.055); --ink:#f4f4f2; --muted:#9c9c98;
    --paper:#1b1b1d; --paper-ink:#f4f4f2; --slate:#efefe9; --slate-ink:#101011;
    --edge:#efefe9; --smudge:rgba(255,255,255,.07);
    --card-bg:#1b1b1d; --card-ink:#f4f4f2;
    --shot-shadow:rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  --bg:#101011; --grid:rgba(255,255,255,.055); --ink:#f4f4f2; --muted:#9c9c98;
  --paper:#1b1b1d; --paper-ink:#f4f4f2; --slate:#efefe9; --slate-ink:#101011;
  --edge:#efefe9; --smudge:rgba(255,255,255,.07);
  --card-bg:#1b1b1d; --card-ink:#f4f4f2;
  --shot-shadow:rgba(0,0,0,.62);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background-color:var(--bg); color:var(--ink);
  font-family:var(--mono); font-size:15px; line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:30px 30px;
}

/* ---------- shell: sidebar + main ---------- */
.shell{
  max-width:1360px; margin:0 auto; padding:36px 30px 90px;
  display:grid; grid-template-columns:268px minmax(0,1fr); gap:50px; align-items:start;
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:26px;padding:26px 20px 70px}
}

/* ---------- sidebar ---------- */
.side{position:sticky;top:36px}
@media (max-width:900px){.side{position:static}}

.sidehead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
h1.sitetitle{
  font-family:var(--marker); font-weight:400; font-size:clamp(30px,4.4vw,42px);
  line-height:1.02; margin:0; letter-spacing:.5px; text-transform:uppercase;
  position:relative; display:inline-block; z-index:0;
}
h1.sitetitle::after{
  content:""; position:absolute; left:-8px; right:-8px; top:16%; height:.5em;
  background:var(--smudge); z-index:-1; transform:rotate(-1.4deg);
  border-radius:60px 20px 50px 18px/18px 40px 16px 55px;
}
.tagline{
  font-weight:700; font-size:11px; letter-spacing:.17em; text-transform:uppercase;
  color:var(--muted); margin:14px 0 0; white-space:pre-line; line-height:1.7;
}
.themebtn{
  flex:none; width:42px; height:42px; cursor:pointer; font-size:17px; line-height:1;
  background:var(--paper); color:var(--paper-ink);
  border:2.5px solid var(--edge); box-shadow:4px 4px 0 var(--edge);
  border-radius:220px 16px 200px 16px/16px 200px 16px 220px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.themebtn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--edge)}
.themebtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--edge)}

nav.sidenav{display:flex;flex-direction:column;gap:11px;margin:30px 0 0}
@media (max-width:900px){nav.sidenav{flex-direction:row;flex-wrap:wrap;gap:10px;margin:22px 0 0}}
.tab{
  font-family:var(--marker); font-size:18px; letter-spacing:.6px; cursor:pointer;
  text-align:left; padding:8px 18px 9px; background:var(--paper); color:var(--paper-ink);
  border:2.5px solid var(--edge); box-shadow:4px 4px 0 var(--edge);
  border-radius:200px 14px 180px 14px/14px 180px 14px 200px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.tab:nth-child(even){border-radius:14px 200px 14px 180px/180px 14px 200px 14px}
.tab:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--edge)}
.tab[aria-selected="true"]{background:var(--slate);color:var(--slate-ink);transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}

.sidefoot{margin:30px 0 0;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
@media (max-width:900px){.sidefoot{display:none}}

/* ---------- sub tabs ---------- */
.subtabs{display:flex;gap:10px;margin:0 0 30px}
.subtab{
  font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:.15em;
  text-transform:uppercase; cursor:pointer; padding:8px 17px;
  background:transparent; color:var(--ink);
  border:2.5px dashed var(--edge); border-radius:160px 12px 150px 12px/12px 150px 12px 160px;
}
.subtab[aria-selected="true"]{border-style:solid;background:var(--slate);color:var(--slate-ink);box-shadow:3px 3px 0 var(--edge)}

/* ---------- board ---------- */
.board{
  display:grid; align-items:start; gap:34px 30px;
  grid-template-columns:repeat(3,minmax(0,1fr));
}
@media (max-width:1199px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:699px){.board{grid-template-columns:1fr}}

/* Every card is the same sheet of paper: white by day, black by night.
   Thin rule, no second stroke — a note, not a sketch. */
.card{
  position:relative; margin:0; padding:22px 24px 20px;
  border:1.5px solid var(--card-ink); box-shadow:4px 4px 0 var(--edge);
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  background:var(--card-bg); color:var(--card-ink);
  transition:transform .14s ease, box-shadow .14s ease;
}
.card:hover{transform:translate(2px,2px) rotate(0deg)!important;box-shadow:2px 2px 0 var(--edge)}
.card::before{
  content:""; position:absolute; top:-11px; left:50%; width:66px; height:20px;
  background:var(--smudge); border:1px solid var(--smudge);
  transform:translateX(-50%) rotate(-2.5deg);
}
.card h3{
  font-family:var(--marker); font-weight:400; font-size:23px; line-height:1.2;
  margin:2px 0 12px; letter-spacing:.4px;
}
.card p.desc{margin:2px 0 0;font-size:14px}
.squig{display:block;width:64px;height:7px;opacity:.5;margin:-8px 0 10px}
.squig path{stroke:currentColor;stroke-width:1.6;fill:none}

/* Description and Next are one thought, so they sit close together. */
.next{display:flex;gap:9px;align-items:flex-start;margin:10px 0 0;font-size:13.5px}
.next svg{flex:none;width:15px;height:15px;margin-top:3px;stroke:currentColor;fill:none;stroke-width:1.8}
.next b{font-weight:700}

/* The date is quiet text under the title, not a frame. Only the real
   link should look clickable on a card. Opacity rather than a fixed
   colour so it stays muted on both the light and dark card. */
.carddate{
  display:block; margin:-6px 0 13px;
  font-size:10.5px; font-weight:700; letter-spacing:.15em;
  text-transform:uppercase; opacity:.55;
}
.carddate.soon{opacity:1}

/* ---------- link rows (project cards + writing) ---------- */
.linkrow{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0}
/* A wider gap before the link than between description and Next,
   so the link reads as the separate, actionable thing. */
.card .linkrow{margin:22px 0 0}
.inklink{
  font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; cursor:pointer; padding:5px 13px;
  background:transparent; color:inherit;
  border:2.5px solid currentColor; border-radius:150px 11px 140px 11px/11px 140px 11px 150px;
  text-decoration:none; display:inline-block;
}
.inklink:hover{background:currentColor}
.inklink:hover .txt{color:var(--card-bg)}

/* ---------- galleries (art + microscopy) ----------
   No frame and no border: a photograph taped straight onto the page. */
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:52px 38px}
.frame{position:relative;margin:0;padding:0;background:none;border:0}

/* the strip of tape holding it down */
.frame::before{
  content:""; position:absolute; z-index:2; top:-11px; left:50%;
  width:76px; height:23px; background:var(--smudge);
  border:1px solid var(--smudge);
  transform:translateX(-50%) rotate(-2.5deg);
}
.frame img{
  display:block; width:100%; height:auto; border:0;
  box-shadow:0 7px 20px var(--shot-shadow), 0 1px 3px var(--shot-shadow);
}

/* the picture itself is the button */
.shot{
  display:block; position:relative; width:100%; margin:0; padding:0; border:0;
  background:none; line-height:0; cursor:zoom-in;
}
/* a clip announces itself */
.playmark{
  position:absolute; z-index:3; left:50%; top:50%;
  width:52px; height:52px; margin:-26px 0 0 -26px;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; padding-left:4px;
  color:#0a0a0a; background:rgba(246,246,244,.93);
  border:2px solid #0a0a0a; border-radius:50%;
  pointer-events:none; transition:transform .14s ease;
}
.shot:hover .playmark{transform:scale(1.07)}
.shot:focus-visible{outline:3px solid var(--edge);outline-offset:4px}
.frame .ph{
  display:flex;align-items:center;justify-content:center;text-align:center;
  aspect-ratio:4/5;border:1.5px dashed var(--edge);font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);padding:16px;
}
.frame figcaption{padding:0 2px}
.frame h3{font-family:var(--marker);font-weight:400;font-size:19px;margin:15px 0 3px;letter-spacing:.4px}
.frame .meta{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.frame .note{font-size:13px;margin:9px 0 0;color:var(--muted)}

/* ---------- writing ---------- */
.writing{max-width:760px}
.entry{
  position:relative; margin:0 0 26px; padding:22px 24px 20px;
  background:var(--paper); color:var(--paper-ink);
  border:2.5px solid var(--edge); box-shadow:6px 6px 0 var(--edge);
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
}
.entry h3{font-family:var(--marker);font-weight:400;font-size:22px;margin:0 0 4px;letter-spacing:.4px}
.entry .meta{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:0 0 11px}
.entry p.blurb{margin:0}
.entry .body{margin:15px 0 0;padding:15px 0 0;border-top:2px dashed var(--edge);display:none}
.entry.open .body{display:block}
.entry .body p{margin:0 0 12px}
.entry .body p:last-child{margin:0}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.about{grid-template-columns:1fr}}
.bio{
  padding:28px 30px 26px; background:var(--paper); color:var(--paper-ink);
  border:2.5px solid var(--edge); box-shadow:7px 7px 0 var(--edge);
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
}
.bio p{margin:0 0 15px}
.bio p:last-child{margin:0}
.facts{
  position:relative;
  padding:24px 26px; background:var(--slate); color:var(--slate-ink);
  border:2.5px solid var(--slate-ink); box-shadow:7px 7px 0 var(--edge);
  border-radius:15px 255px 15px 225px/225px 15px 255px 15px;
  transform:rotate(.7deg);
}
.facts h3{font-family:var(--marker);font-weight:400;font-size:21px;margin:0 0 14px;letter-spacing:.4px}
.facts ul{list-style:none;margin:0;padding:0}
.facts li{display:flex;gap:10px;padding:8px 0;font-size:13.5px;border-bottom:1px dashed currentColor}
.facts li:last-child{border-bottom:0}
.facts li b{flex:none;width:78px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;padding-top:2px}

/* ---------- lightbox ----------
   Fixed dark ground in both themes: the picture supplies the colour. */
.lightbox{
  position:fixed; inset:0; z-index:60; padding:34px 20px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(8,8,9,.92);
}
body.lb-open{overflow:hidden}
.lb-figure{margin:0;max-width:min(1080px,92vw);display:flex;flex-direction:column;align-items:center}
.lb-figure img,.lb-figure video{
  display:block; max-width:100%; max-height:74vh; width:auto; height:auto;
  border:2.5px solid #f4f4f2; background:#f4f4f2;
}
.lb-figure video{background:#0a0a0a}
.lb-cap{margin:15px 0 0;text-align:center;color:#f4f4f2;max-width:68ch}
.lb-cap b{font-family:var(--marker);font-weight:400;font-size:20px;letter-spacing:.4px;display:block}
.lb-cap .m{display:block;margin-top:5px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;opacity:.7}
.lb-cap .n{display:block;margin-top:9px;font-size:13.5px;opacity:.87}
.lb-btn{
  position:absolute; cursor:pointer; line-height:1;
  font-family:var(--mono); font-weight:700;
  color:#0a0a0a; background:#f4f4f2; border:2.5px solid #0a0a0a;
  box-shadow:4px 4px 0 #0a0a0a;
  transition:transform .12s ease, box-shadow .12s ease;
}
.lb-btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #0a0a0a}
.lb-close{top:20px;right:22px;width:44px;height:44px;font-size:19px;
  border-radius:220px 16px 200px 16px/16px 200px 16px 220px}
.lb-nav{top:50%;margin-top:-25px;width:44px;height:50px;font-size:23px;
  border-radius:180px 14px 170px 14px/14px 170px 14px 180px}
.lb-prev{left:18px}
.lb-next{right:18px}
@media (max-width:620px){
  .lb-nav{top:auto;bottom:18px;margin-top:0}
  .lb-prev{left:calc(50% - 58px)}
  .lb-next{right:calc(50% - 58px)}
  .lb-figure img{max-height:58vh}
}

.empty{font-size:13px;color:var(--muted);letter-spacing:.06em;padding:20px 0}
[hidden]{display:none!important}
</style>
</head>

<div class="shell">

  <aside class="side">
    <div class="sidehead">
      <h1 class="sitetitle" id="sitetitle"></h1>
      <button class="themebtn" id="themebtn" type="button" aria-label="Toggle dark mode">&#9789;</button>
    </div>
    <p class="tagline" id="tagline"></p>

    <nav class="sidenav" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-panel="about" aria-selected="false">About</button>
      <button class="tab" role="tab" data-panel="quests" aria-selected="true">Quest Log</button>
      <button class="tab" role="tab" data-panel="art" aria-selected="false">Art</button>
      <button class="tab" role="tab" data-panel="microscopy" aria-selected="false">Microscopy</button>
      <button class="tab" role="tab" data-panel="writing" aria-selected="false">Writing</button>
    </nav>

    <p class="sidefoot" id="sidefoot"></p>
  </aside>

  <main>
    <section id="panel-about" role="tabpanel" hidden>
      <div class="about">
        <div class="bio" id="bio"></div>
        <aside class="facts">
          <h3>Snapshot</h3>
          <ul id="facts"></ul>
        </aside>
      </div>
    </section>

    <section id="panel-quests" role="tabpanel">
      <div class="subtabs" role="tablist" aria-label="Project shelf">
        <button class="subtab" role="tab" data-shelf="current" aria-selected="true">Current</button>
        <button class="subtab" role="tab" data-shelf="past" aria-selected="false">Past</button>
      </div>
      <div class="board" id="board"></div>
    </section>

    <section id="panel-art" role="tabpanel" hidden>
      <div class="artgrid" id="artgrid"></div>
    </section>

    <section id="panel-microscopy" role="tabpanel" hidden>
      <div class="artgrid" id="scopegrid"></div>
    </section>

    <section id="panel-writing" role="tabpanel" hidden>
      <div class="writing" id="writinglist"></div>
    </section>
  </main>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button class="lb-btn lb-close" id="lb-close" type="button" aria-label="Close">&#10005;</button>
  <button class="lb-btn lb-nav lb-prev" id="lb-prev" type="button" aria-label="Previous image">&#8249;</button>
  <button class="lb-btn lb-nav lb-next" id="lb-next" type="button" aria-label="Next image">&#8250;</button>
  <figure class="lb-figure">
    <img id="lb-img" alt="">
    <video id="lb-video" controls playsinline preload="metadata" hidden></video>
    <figcaption class="lb-cap" id="lb-cap"></figcaption>
  </figure>
</div>

<script>
(function () {
  "use strict";

  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  /* Only allow link targets we are willing to render. */
  var safeURL = function (u) {
    var s = String(u == null ? "" : u).trim();
    if (!s) return "";
    if (/^(https?:\/\/|mailto:|\/|\.\/|#)/i.test(s)) return s;
    return "";
  };

  var linkRow = function (links) {
    var items = (links || []).map(function (l) {
      var href = safeURL(l && l.url);
      if (!href) return "";
      return '<a class="inklink" href="' + esc(href) + '" target="_blank" rel="noopener">' +
        '<span class="txt">' + esc(l.label || "Link") + " ↗</span></a>";
    }).filter(Boolean);
    return items.length ? '<div class="linkrow">' + items.join("") + "</div>" : "";
  };

  /* ---------- theme ---------- */
  var root = document.documentElement;
  var btn = document.getElementById("themebtn");
  var saved = null;
  try { saved = localStorage.getItem("tina-theme"); } catch (e) {}
  if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);

  var isDark = function () {
    var t = root.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  };
  var paintBtn = function () { btn.innerHTML = isDark() ? "&#9788;" : "&#9789;"; };
  paintBtn();
  btn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("tina-theme", next); } catch (e) {}
    paintBtn();
  });

  /* ---------- dates ---------- */
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var parseDay = function (s) {
    if (!s) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]);
  };
  var today = function () {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  };
  var fmtShort = function (d) { return MONTHS[d.getMonth()] + " " + d.getDate(); };
  var fmtLong = function (d) { return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); };
  var daysOut = function (d) { return Math.round((d - today()) / 86400000); };

  /* ---------- header ---------- */
  document.title = CONTENT.owner && CONTENT.owner !== CONTENT.siteTitle
    ? CONTENT.siteTitle + " · " + CONTENT.owner
    : CONTENT.siteTitle;
  document.getElementById("sitetitle").textContent = CONTENT.siteTitle;
  document.getElementById("tagline").textContent = CONTENT.tagline;
  document.getElementById("sidefoot").textContent =
    (CONTENT.owner || CONTENT.siteTitle) + " · " + new Date().getFullYear();

  var projects = CONTENT.projects || [];

  /* ---------- project board ---------- */
  var SQUIG = '<svg class="squig" viewBox="0 0 64 7" aria-hidden="true">' +
    '<path d="M1 5 Q8 1 15 5 T29 5 T43 5 T57 5" stroke-linecap="round"/></svg>';
  var CAL = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>';

  var tilt = function (i) { return [-1.4, 1.1, -0.6, 1.6, -1.1, 0.7, -1.8, 1.3][i % 8]; };

  var cardHTML = function (p, i) {
    var d = parseDay(p.date);
    var out = d ? daysOut(d) : null;
    var soon = out !== null && out >= 0 && out <= 7;

    var chipText = p.when ? p.when : (d ? fmtShort(d) : "");
    var chip = chipText
      ? '<span class="carddate' + (soon && !p.when ? " soon" : "") + '">' +
        esc(chipText) + "</span>"
      : "";

    var nextLine = p.next
      ? '<div class="next">' + CAL + "<div><b>Next:</b> " + esc(p.next) + "</div></div>"
      : "";

    return '<article class="card" style="transform:rotate(' +
      tilt(i) + 'deg)">' +
      // Fixed order on every card: title, date, description, next, link.
      // Anything missing is simply skipped; the order never changes.
      "<h3>" + esc(p.title) + "</h3>" + SQUIG + chip +
      (p.desc ? '<p class="desc">' + esc(p.desc) + "</p>" : "") +
      nextLine +
      linkRow(p.links) +
      "</article>";
  };

  var board = document.getElementById("board");
  var shelf = "current";
  var drawBoard = function () {
    var list = projects.filter(function (p) {
      return (p.shelf || "current") === shelf;
    });
    board.innerHTML = list.length
      ? list.map(cardHTML).join("")
      : '<p class="empty">Nothing on this shelf yet.</p>';
  };

  Array.prototype.forEach.call(document.querySelectorAll(".subtab"), function (b) {
    b.addEventListener("click", function () {
      shelf = b.dataset.shelf;
      Array.prototype.forEach.call(document.querySelectorAll(".subtab"), function (o) {
        o.setAttribute("aria-selected", String(o === b));
      });
      drawBoard();
    });
  });
  drawBoard();

  /* ---------- galleries ----------
     A frame that actually has an image becomes a button and records its
     place in that gallery's list. Placeholder frames stay inert. */
  var shotTilt = function (i) { return [-1.1, .8, -.5, 1.3, -.9, .6][i % 6]; };

  var buildGallery = function (items, metaOf) {
    var shots = [];
    var html = (items || []).map(function (a, i) {
      var meta = metaOf(a).filter(Boolean).join(" · ");
      var media;
      if (a.img || a.video) {
        media = '<button class="shot" type="button" data-i="' + shots.length +
          '" aria-label="' + (a.video ? "Play " : "View ") + esc(a.title) +
          (a.video ? "" : " larger") + '">' +
          (a.img
            ? '<img src="' + esc(a.img) + '" alt="' + esc(a.title) + '" loading="lazy">'
            : '<div class="ph">Clip</div>') +
          (a.video ? '<span class="playmark" aria-hidden="true">\u25b6</span>' : "") +
          "</button>";
        shots.push({
          src: a.imgFull || a.img || "",
          video: a.video || "",
          title: a.title, meta: meta, note: a.note || ""
        });
      } else {
        media = '<div class="ph">Image coming</div>';
      }
      return '<figure class="frame" style="transform:rotate(' + shotTilt(i) + 'deg)">' + media +
        "<figcaption><h3>" + esc(a.title) + "</h3>" +
        (meta ? '<div class="meta">' + esc(meta) + "</div>" : "") +
        (a.note ? '<p class="note">' + esc(a.note) + "</p>" : "") +
        "</figcaption></figure>";
    }).join("");
    return { html: html, shots: shots };
  };

  var artG = buildGallery(CONTENT.art, function (a) { return [a.year, a.medium]; });
  var scopeG = buildGallery(CONTENT.microscopy, function (a) {
    return [a.specimen, a.mag, a.technique];
  });

  document.getElementById("artgrid").innerHTML =
    artG.html || '<p class="empty">No art up yet.</p>';
  document.getElementById("scopegrid").innerHTML =
    scopeG.html || '<p class="empty">No slides up yet.</p>';

  /* ---------- lightbox ---------- */
  var lb = document.getElementById("lightbox");
  var lbImg = document.getElementById("lb-img");
  var lbVid = document.getElementById("lb-video");
  var lbCap = document.getElementById("lb-cap");
  var lbPrev = document.getElementById("lb-prev");
  var lbNext = document.getElementById("lb-next");
  var viewList = [];
  var viewAt = 0;
  var opener = null;

  var stopVideo = function () {
    try { lbVid.pause(); } catch (e) {}
    lbVid.hidden = true;
    lbVid.removeAttribute("src");
    lbVid.load();
  };

  var paintShot = function () {
    var v = viewList[viewAt];
    if (!v) return;
    if (v.video) {
      lbImg.hidden = true;
      lbImg.removeAttribute("src");
      lbVid.hidden = false;
      if (v.src) lbVid.setAttribute("poster", v.src);
      else lbVid.removeAttribute("poster");
      lbVid.src = v.video;
      lbVid.setAttribute("aria-label", v.title);
    } else {
      stopVideo();
      lbImg.hidden = false;
      lbImg.src = v.src;
      lbImg.alt = v.title;
    }
    lbCap.innerHTML = "<b>" + esc(v.title) + "</b>" +
      (v.meta ? '<span class="m">' + esc(v.meta) + "</span>" : "") +
      (v.note ? '<span class="n">' + esc(v.note) + "</span>" : "");
    var many = viewList.length > 1;
    lbPrev.hidden = !many;
    lbNext.hidden = !many;
  };
  var openShot = function (list, i, trigger) {
    if (!list.length) return;
    viewList = list;
    viewAt = i;
    opener = trigger || null;
    paintShot();
    lb.hidden = false;
    document.body.classList.add("lb-open");
    document.getElementById("lb-close").focus();
  };
  var closeShot = function () {
    lb.hidden = true;
    document.body.classList.remove("lb-open");
    stopVideo();
    lbImg.removeAttribute("src");
    if (opener) { opener.focus(); opener = null; }
  };
  var stepShot = function (d) {
    viewAt = (viewAt + d + viewList.length) % viewList.length;
    paintShot();
  };

  var wireGrid = function (id, list) {
    document.getElementById(id).addEventListener("click", function (ev) {
      var b = ev.target.closest(".shot");
      if (!b) return;
      openShot(list, +b.dataset.i, b);
    });
  };
  wireGrid("artgrid", artG.shots);
  wireGrid("scopegrid", scopeG.shots);

  lb.addEventListener("click", function (ev) {
    if (ev.target === lb || ev.target.closest("#lb-close")) closeShot();
    else if (ev.target.closest("#lb-prev")) stepShot(-1);
    else if (ev.target.closest("#lb-next")) stepShot(1);
  });
  document.addEventListener("keydown", function (ev) {
    if (lb.hidden) return;
    if (ev.key === "Escape") { closeShot(); return; }
    if (ev.target === lbVid) return;   // let the player have its own arrow keys
    if (ev.key === "ArrowLeft" && viewList.length > 1) stepShot(-1);
    else if (ev.key === "ArrowRight" && viewList.length > 1) stepShot(1);
  });

  /* ---------- writing ---------- */
  document.getElementById("writinglist").innerHTML = (CONTENT.writing || []).map(function (w, i) {
    var d = parseDay(w.date);
    var meta = [w.kind, d ? fmtLong(d) : ""].filter(Boolean).join(" · ");
    var hasBody = w.body && w.body.length;
    var links = "";
    if (hasBody) links += '<button class="inklink" data-read="' + i + '"><span class="txt">Read it</span></button>';
    var href = safeURL(w.link);
    if (href) links += '<a class="inklink" href="' + esc(href) +
      '" target="_blank" rel="noopener"><span class="txt">Open ↗</span></a>';

    return '<article class="entry" id="entry-' + i + '">' +
      "<h3>" + esc(w.title) + "</h3>" +
      (meta ? '<p class="meta">' + esc(meta) + "</p>" : "") +
      (w.blurb ? '<p class="blurb">' + esc(w.blurb) + "</p>" : "") +
      (links ? '<div class="linkrow">' + links + "</div>" : "") +
      (hasBody ? '<div class="body">' + w.body.map(function (para) {
        return "<p>" + esc(para) + "</p>";
      }).join("") + "</div>" : "") +
      "</article>";
  }).join("") || '<p class="empty">Nothing published yet.</p>';

  document.getElementById("writinglist").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-read]");
    if (!b) return;
    var entry = document.getElementById("entry-" + b.dataset.read);
    var open = entry.classList.toggle("open");
    b.querySelector(".txt").textContent = open ? "Close" : "Read it";
  });

  /* ---------- about ---------- */
  document.getElementById("bio").innerHTML = (CONTENT.about.bio || []).map(function (p) {
    return "<p>" + esc(p) + "</p>";
  }).join("");
  document.getElementById("facts").innerHTML = (CONTENT.about.facts || []).map(function (f) {
    return "<li><b>" + esc(f.label) + "</b><span>" + esc(f.value) + "</span></li>";
  }).join("");

  /* ---------- section tabs ----------
     Change DEFAULT_PANEL to pick which section loads first. */
  var PANELS = ["about", "quests", "art", "microscopy", "writing"];
  var DEFAULT_PANEL = "quests";

  var show = function (which) {
    PANELS.forEach(function (p) {
      document.getElementById("panel-" + p).hidden = p !== which;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
      t.setAttribute("aria-selected", String(t.dataset.panel === which));
    });
    if (location.hash.slice(1) !== which) history.replaceState(null, "", "#" + which);
  };
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
    t.addEventListener("click", function () { show(t.dataset.panel); });
  });
  var start = location.hash.slice(1);
  show(PANELS.indexOf(start) > -1 ? start : DEFAULT_PANEL);
})();
</script>
</body>
</html>
